<?xml version="1.0" encoding="UTF-8"?>
<!--
  FOCUX PERSONAL — App Icon (1024x1024)
  Background: #05070D (rounded 10% optional via CSS/mask)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient (Subtle radial glow) -->
    <radialGradient id="app-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0B1536"/>
      <stop offset="100%" stop-color="#05070D"/>
    </radialGradient>

    <!-- F Gradients (Same as logo_icon.svg) -->
    <linearGradient id="app-grad-body" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1C3FAA"/>
      <stop offset="45%" stop-color="#1A3ABF"/>
      <stop offset="100%" stop-color="#080E2E"/>
    </linearGradient>

    <linearGradient id="app-grad-gloss-top" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="30%" stop-color="#BFDBFE"/>
      <stop offset="75%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="app-grad-gloss-mid" x1="5%" y1="0%" x2="95%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="55%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="app-grad-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="60%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="app-neon-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="35" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="app-dot-glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="app-soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="app-shadow-depth" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="15" dy="25" stdDeviation="25" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Base App Icon Background -->
  <!-- Remove rx/ry if you need a pure square for stores -->
  <rect width="1024" height="1024" fill="url(#app-bg)" rx="100" ry="100"/>

  <!-- Center the F icon (Scale 1.1, centered) -->
  <g transform="translate(142, 112) scale(0.95)">
    <!-- Ambient glow behind F -->
    <ellipse cx="490" cy="490" rx="450" ry="430" fill="#1D4ED8" opacity="0.3" filter="url(#app-soft-glow)"/>

    <!-- F Shadow -->
    <path filter="url(#app-shadow-depth)"
      d="M 158,75 L 800,75 C 826,75 832,97 832,122 L 832,228 C 830,252 815,258 792,258
         L 312,258 L 312,418 L 600,418 C 625,418 632,438 632,460
         L 632,552 C 630,570 618,576 598,576 L 312,576 L 312,924
         C 310,944 298,952 278,952 L 162,952 C 140,952 132,938 132,918
         L 132,97 C 133,79 144,75 158,75 Z"
      fill="#030814" opacity="0.7"/>

    <!-- F Body -->
    <path
      d="M 158,75 L 800,75 C 826,75 832,97 832,122 L 832,228 C 830,252 815,258 792,258
         L 312,258 L 312,418 L 600,418 C 625,418 632,438 632,460
         L 632,552 C 630,570 618,576 598,576 L 312,576 L 312,924
         C 310,944 298,952 278,952 L 162,952 C 140,952 132,938 132,918
         L 132,97 C 133,79 144,75 158,75 Z"
      fill="url(#app-grad-body)"/>

    <!-- Gloss Top -->
    <path
      d="M 238,75 L 800,75 C 826,75 832,97 832,122 L 832,200 C 826,220 810,228 786,228
         L 238,228 Z"
      fill="url(#app-grad-gloss-top)" opacity="0.92"/>
    <path d="M 260,85 L 680,85 C 700,85 708,95 705,110 L 260,110 Z" fill="white" opacity="0.18"/>

    <!-- Gloss Mid -->
    <path
      d="M 312,418 L 600,418 C 625,418 632,438 632,460 L 632,508
         C 628,524 615,528 596,530 L 312,530 Z"
      fill="url(#app-grad-gloss-mid)" opacity="0.88"/>

    <!-- Rim Glow -->
    <path
      d="M 158,75 L 800,75 C 826,75 832,97 832,122 L 832,228 C 830,252 815,258 792,258
         L 312,258 L 312,418 L 600,418 C 625,418 632,438 632,460
         L 632,552 C 630,570 618,576 598,576 L 312,576 L 312,924
         C 310,944 298,952 278,952 L 162,952 C 140,952 132,938 132,918
         L 132,97 C 133,79 144,75 158,75 Z"
      fill="none" stroke="url(#app-grad-rim)" stroke-width="4.5"
      filter="url(#app-neon-glow)" opacity="0.9"/>

    <!-- Circuit Traces -->
    <g opacity="0.8" stroke="#22D3EE" stroke-linecap="round" fill="none">
      <line x1="132" y1="330" x2="230" y2="330" stroke-width="2.5"/>
      <line x1="230" y1="330" x2="230" y2="375" stroke-width="2.5"/>
      <line x1="230" y1="375" x2="282" y2="375" stroke-width="2.5"/>
      <line x1="132" y1="460" x2="195" y2="460" stroke-width="2"/>
      <line x1="195" y1="430" x2="195" y2="490" stroke-width="2"/>
      <line x1="165" y1="280" x2="165" y2="400" stroke-width="2"/>
      <line x1="165" y1="380" x2="215" y2="380" stroke-width="2"/>
      <line x1="135" y1="640" x2="240" y2="640" stroke-width="2"/>
      <line x1="240" y1="620" x2="240" y2="660" stroke-width="2"/>
      <line x1="132" y1="710" x2="200" y2="710" stroke-width="1.5"/>
      <line x1="200" y1="710" x2="200" y2="740" stroke-width="1.5"/>
      <line x1="200" y1="740" x2="255" y2="740" stroke-width="1.5"/>
    </g>

    <!-- Circuit Dots -->
    <g fill="#22D3EE" filter="url(#app-dot-glow)">
      <circle cx="230" cy="330" r="5.5"/>
      <circle cx="230" cy="375" r="5"/>
      <circle cx="195" cy="460" r="5.5"/>
      <circle cx="165" cy="380" r="4.5"/>
      <circle cx="240" cy="640" r="5"/>
      <circle cx="200" cy="740" r="4.5"/>
      <circle cx="255" cy="740" r="4"/>
    </g>

    <!-- Sun & Moon -->
    <g transform="translate(728, 130)" filter="url(#app-soft-glow)">
      <circle cx="0" cy="0" r="14" fill="#E5E7EB" opacity="0.9"/>
      <g stroke="#E5E7EB" stroke-width="3" stroke-linecap="round" opacity="0.75">
        <line x1="0" y1="-22" x2="0" y2="-28"/>
        <line x1="0" y1="22" x2="0" y2="28"/>
        <line x1="-22" y1="0" x2="-28" y2="0"/>
        <line x1="22" y1="0" x2="28" y2="0"/>
        <line x1="-16" y1="-16" x2="-21" y2="-21"/>
        <line x1="16" y1="-16" x2="21" y2="-21"/>
        <line x1="-16" y1="16" x2="-21" y2="21"/>
        <line x1="16" y1="16" x2="21" y2="21"/>
      </g>
    </g>
    <g transform="translate(215, 840)" filter="url(#app-dot-glow)">
      <path d="M 0,-21 A 21,21 0 1,1 15,10.5 A 13.5,13.5 0 1,0 0,-21 Z" fill="#22D3EE" opacity="0.9"/>
    </g>

    <!-- Heartbeat -->
    <g stroke="#22D3EE" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#app-soft-glow)" opacity="0.8">
      <polyline points="315,570 340,570 350,550 365,592 378,542 392,598 405,570 440,570"/>
    </g>
    
    <!-- Inner Rim -->
    <path d="M 158,75 L 800,75 C 826,75 832,97 832,122 L 832,228 C 830,252 815,258 792,258 L 312,258 L 312,418 L 600,418 C 625,418 632,438 632,460 L 632,552 C 630,570 618,576 598,576 L 312,576 L 312,924 C 310,944 298,952 278,952 L 162,952 C 140,952 132,938 132,918 L 132,97 C 133,79 144,75 158,75 Z" fill="none" stroke="white" stroke-width="1.5" opacity="0.15"/>
  </g>
</svg>
