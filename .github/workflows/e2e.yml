name: E2E

# Só push main/develop + manual (nunca PR — evita build web + Playwright em cada PR).
# Analyze/orphan ficam no workflow Analyze (sem duplicar minutos).

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.cursor/**'
      - '.github/workflows/ios-release.yml'
      - '.github/workflows/codeql.yml'
      - '.github/workflows/security.yml'
      - '.github/workflows/semgrep.yml'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright on Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      E2E_BASE_URL: http://localhost:61791

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build flutter web
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          flutter build web --release \
            --dart-define=GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID

      - name: Serve flutter web
        working-directory: build/web
        run: |
          npx --yes http-server -p 61791 -s -c-1 &
          for i in {1..30}; do
            if curl -fs http://localhost:61791 >/dev/null; then
              echo "flutter web up"; exit 0
            fi
            sleep 1
          done
          echo "flutter web failed to serve"; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Sem contas QA nos secrets: só o project `public` roda.
      - name: Check E2E secrets
        env:
          E2E_PERSONAL_EMAIL: ${{ secrets.E2E_PERSONAL_EMAIL }}
          E2E_ALUNO_EMAIL: ${{ secrets.E2E_ALUNO_EMAIL }}
        run: |
          if [ -z "$E2E_PERSONAL_EMAIL" ] || [ -z "$E2E_ALUNO_EMAIL" ]; then
            echo "::warning::E2E auth secrets ausentes — Playwright rodará só o project public (@p0 smoke)."
          fi

      - name: Run Playwright
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:61791
          E2E_PERSONAL_EMAIL: ${{ secrets.E2E_PERSONAL_EMAIL }}
          E2E_PERSONAL_SENHA: ${{ secrets.E2E_PERSONAL_SENHA }}
          E2E_ALUNO_EMAIL: ${{ secrets.E2E_ALUNO_EMAIL }}
          E2E_ALUNO_SENHA: ${{ secrets.E2E_ALUNO_SENHA }}
          E2E_ALUNO_ID: ${{ secrets.E2E_ALUNO_ID }}
          CI: 'true'
        run: npm run test:p0

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: e2e/playwright-report
          retention-days: 5

      - name: Upload trace + videos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_id }}
          path: e2e/test-results
          retention-days: 5
