name: E2E

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Secrets de conta real: só push/manual (nunca em PR de fork).
  playwright:
    name: Playwright on Chrome
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      E2E_BASE_URL: http://localhost:61791

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: dart analyze --fatal-warnings --fatal-infos

      - name: Orphan dart scan
        run: dart run tools/find_orphan_dart.dart

      - name: Build flutter web
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          flutter build web --release \
            --dart-define=GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID

      - name: Serve flutter web
        working-directory: build/web
        run: |
          npx --yes http-server -p 61791 -s -c-1 &
          for i in {1..30}; do
            if curl -fs http://localhost:61791 >/dev/null; then
              echo "flutter web up"; exit 0
            fi
            sleep 1
          done
          echo "flutter web failed to serve"; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:61791
          E2E_PERSONAL_EMAIL: ${{ secrets.E2E_PERSONAL_EMAIL }}
          E2E_PERSONAL_SENHA: ${{ secrets.E2E_PERSONAL_SENHA }}
          E2E_ALUNO_EMAIL: ${{ secrets.E2E_ALUNO_EMAIL }}
          E2E_ALUNO_SENHA: ${{ secrets.E2E_ALUNO_SENHA }}
          E2E_ALUNO_ID: ${{ secrets.E2E_ALUNO_ID }}
          CI: 'true'
        run: npm run test:p0

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: e2e/playwright-report
          retention-days: 14

      - name: Upload trace + videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: e2e/test-results
          retention-days: 7
