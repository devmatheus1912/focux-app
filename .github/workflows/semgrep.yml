name: Semgrep SAST

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  semgrep:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: returntocorp/semgrep-action@v1
        with:
          config: p/default
