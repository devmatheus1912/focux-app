name: Analyze

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dart:
    name: Dart analyze (fatal warnings)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: focux-app

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze without warnings or infos
        run: dart analyze --fatal-warnings --fatal-infos

      - name: Unit tests
        run: flutter test

      - name: Orphan dart scan
        run: dart run tools/find_orphan_dart.dart
