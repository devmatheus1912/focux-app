name: Analyze

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  dart:
    name: Dart analyze (fatal warnings)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: focux-app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze without warnings
        run: dart analyze --fatal-warnings

      - name: Unit tests
        run: flutter test

      - name: Orphan dart scan
        run: dart run tools/find_orphan_dart.dart
