name: Security

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read
  # gitleaks-action lista commits do PR via API — sem isso: 403
  # "Resource not accessible by integration" em pull_request.
  pull-requests: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
