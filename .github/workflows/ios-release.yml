name: iOS Release

# Build IPA assinado (TestFlight) com certificate pinning.
# Assinatura = App Store Connect API (igual Codemagic Automatic) — sem Mac local / sem .p12.
#
# Secrets obrigatórios:
#   API_CERT_PINS
#   APP_STORE_CONNECT_API_KEY_ID
#   APP_STORE_CONNECT_API_ISSUER_ID
#   APP_STORE_CONNECT_API_KEY_BASE64
#
# Opcionais: API_URL, PUBLIC_WEB_URL, GOOGLE_*

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "Enviar IPA ao TestFlight (precisa ASC API key)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_BUNDLE_ID: com.focux.focuxApp
  APPLE_TEAM_ID: TVY2QLKX54
  API_URL_DEFAULT: https://focux-backend-production.up.railway.app
  PUBLIC_WEB_URL_DEFAULT: https://focuxpersonal.com
  MATCH_KEYCHAIN_NAME: focux-signing

jobs:
  build-ipa:
    name: Build IPA (macOS)
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Xcode
        run: |
          for p in \
            /Applications/Xcode_16.2.app/Contents/Developer \
            /Applications/Xcode_16.1.app/Contents/Developer \
            /Applications/Xcode_16.0.app/Contents/Developer \
            /Applications/Xcode.app/Contents/Developer
          do
            if [[ -d "$p" ]]; then
              sudo xcode-select -s "$p"
              break
            fi
          done
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode GoogleService-Info.plist (optional)
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [[ -z "${GOOGLE_SERVICE_INFO_PLIST_BASE64:-}" ]]; then
            echo "Sem GOOGLE_SERVICE_INFO_PLIST_BASE64 — Firebase iOS fica off neste build."
            exit 0
          fi
          echo -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          chmod +x tools/ios/sync_google_signin_url_scheme.sh || true
          tools/ios/sync_google_signin_url_scheme.sh || true

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Sync signing (ASC API → cert + profile)
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APP_BUNDLE_ID: ${{ env.APP_BUNDLE_ID }}
          MATCH_KEYCHAIN_NAME: ${{ env.MATCH_KEYCHAIN_NAME }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_STORE_CONNECT_API_KEY_ID:-}" || -z "${APP_STORE_CONNECT_API_ISSUER_ID:-}" || -z "${APP_STORE_CONNECT_API_KEY_BASE64:-}" ]]; then
            echo "::error::Faltam secrets ASC: APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_API_ISSUER_ID, APP_STORE_CONNECT_API_KEY_BASE64."
            exit 1
          fi

          # Senha efêmera do keychain no runner (não precisa de Mac / .p12).
          if [[ -z "${KEYCHAIN_PASSWORD:-}" ]]; then
            KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
            echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
            export KEYCHAIN_PASSWORD
          fi

          KEY_DIR="$RUNNER_TEMP/asc_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o "$KEY_PATH"
          export APP_STORE_CONNECT_API_KEY_PATH="$KEY_PATH"

          cd ios
          fastlane sync_signing

      - name: Write ExportOptions.ci.plist
        run: |
          set -euo pipefail
          if [[ -z "${PROVISIONING_PROFILE_NAME:-}" ]]; then
            echo "::error::PROVISIONING_PROFILE_NAME vazio — sync_signing falhou?"
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:$APP_BUNDLE_ID $PROVISIONING_PROFILE_NAME" ios/ExportOptions.ci.plist
          plutil -lint ios/ExportOptions.ci.plist
          cat ios/ExportOptions.ci.plist

      - name: Build IPA (release + cert pins)
        env:
          API_CERT_PINS: ${{ secrets.API_CERT_PINS }}
          API_URL: ${{ secrets.API_URL }}
          PUBLIC_WEB_URL: ${{ secrets.PUBLIC_WEB_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${API_CERT_PINS:-}" ]]; then
            echo "::error::Secret API_CERT_PINS obrigatório (tools/release/fetch-api-cert-pin.ps1)."
            exit 1
          fi

          API_URL="${API_URL:-$API_URL_DEFAULT}"
          PUBLIC_WEB_URL="${PUBLIC_WEB_URL:-$PUBLIC_WEB_URL_DEFAULT}"

          EXTRA=()
          if [[ -n "${GOOGLE_WEB_CLIENT_ID:-}" ]]; then
            EXTRA+=(--dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID")
          fi
          if [[ -n "${GOOGLE_IOS_CLIENT_ID:-}" ]]; then
            EXTRA+=(--dart-define=GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID")
          fi

          flutter build ipa --release \
            --dart-define=API_URL="$API_URL" \
            --dart-define=PUBLIC_WEB_URL="$PUBLIC_WEB_URL" \
            --dart-define=API_CERT_PINS="$API_CERT_PINS" \
            --dart-define=REQUIRE_API_CERT_PINS=true \
            "${EXTRA[@]}" \
            --export-options-plist=ios/ExportOptions.ci.plist \
            -- \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_NAME"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: focux-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload dSYM (if present)
        uses: actions/upload-artifact@v4
        with:
          name: focux-ios-dsym
          path: build/ios/archive/Runner.xcarchive/dSYMs
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload to TestFlight (optional)
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.upload_testflight)
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ASC_KEY_ID:-}" || -z "${ASC_ISSUER_ID:-}" || -z "${ASC_KEY_BASE64:-}" ]]; then
            echo "::warning::Secrets ASC ausentes — IPA ficou só no artifact (Actions → Artifacts)."
            exit 0
          fi

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo -n "$ASC_KEY_BASE64" | base64 --decode -o "$KEY_PATH"

          shopt -s nullglob
          ipas=(build/ios/ipa/*.ipa)
          if [[ ${#ipas[@]} -eq 0 ]]; then
            echo "::error::Nenhum IPA em build/ios/ipa/"
            exit 1
          fi
          IPA="${ipas[0]}"
          echo "Uploading ${IPA} to App Store Connect..."
          xcrun altool --upload-app \
            -f "${IPA}" \
            -t ios \
            --apiKey "${ASC_KEY_ID}" \
            --apiIssuer "${ASC_ISSUER_ID}"

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$HOME/Library/Keychains/${MATCH_KEYCHAIN_NAME}-db" 2>/dev/null || true
          security delete-keychain "$HOME/Library/Keychains/${MATCH_KEYCHAIN_NAME}.keychain-db" 2>/dev/null || true
