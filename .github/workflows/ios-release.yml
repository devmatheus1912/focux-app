name: iOS Release

# Build IPA assinado (App Store / TestFlight) com certificate pinning.
# Dispare em Actions → iOS Release → Run workflow (ou tag v*).
#
# Secrets obrigatórios: ver comentário no job e o passo a passo no chat.

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: "Enviar IPA ao TestFlight (precisa ASC API key)"
        type: boolean
        default: false
  push:
    tags:
      - "v*"

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_BUNDLE_ID: com.focux.focuxApp
  APPLE_TEAM_ID: TVY2QLKX54
  API_URL_DEFAULT: https://focux-backend-production.up.railway.app
  PUBLIC_WEB_URL_DEFAULT: https://focuxpersonal.com

jobs:
  build-ipa:
    name: Build IPA (macOS)
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Xcode
        run: |
          # Prefer a stable Xcode on the image; fall back to default.
          for p in \
            /Applications/Xcode_16.2.app/Contents/Developer \
            /Applications/Xcode_16.1.app/Contents/Developer \
            /Applications/Xcode_16.0.app/Contents/Developer \
            /Applications/Xcode.app/Contents/Developer
          do
            if [[ -d "$p" ]]; then
              sudo xcode-select -s "$p"
              break
            fi
          done
          xcodebuild -version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Decode GoogleService-Info.plist (optional)
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [[ -z "${GOOGLE_SERVICE_INFO_PLIST_BASE64:-}" ]]; then
            echo "Sem GOOGLE_SERVICE_INFO_PLIST_BASE64 — Firebase iOS fica off neste build."
            exit 0
          fi
          echo -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          chmod +x tools/ios/sync_google_signin_url_scheme.sh || true
          tools/ios/sync_google_signin_url_scheme.sh || true

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Install Apple certificate + provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${BUILD_CERTIFICATE_BASE64:-}" || -z "${BUILD_PROVISION_PROFILE_BASE64:-}" || -z "${P12_PASSWORD:-}" || -z "${KEYCHAIN_PASSWORD:-}" ]]; then
            echo "::error::Faltam secrets de assinatura (BUILD_CERTIFICATE_BASE64, P12_PASSWORD, BUILD_PROVISION_PROFILE_BASE64, KEYCHAIN_PASSWORD)."
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PP_PLIST="$RUNNER_TEMP/pp.plist"
          security cms -D -i "$PP_PATH" > "$PP_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PP_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PP_PLIST")
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROVISIONING_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROVISIONING_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Installed profile: $PROFILE_NAME ($PROFILE_UUID)"

      - name: Write ExportOptions.ci.plist
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:$APP_BUNDLE_ID $PROVISIONING_PROFILE_NAME" ios/ExportOptions.ci.plist
          plutil -lint ios/ExportOptions.ci.plist
          cat ios/ExportOptions.ci.plist

      - name: Build IPA (release + cert pins)
        env:
          API_CERT_PINS: ${{ secrets.API_CERT_PINS }}
          API_URL: ${{ secrets.API_URL }}
          PUBLIC_WEB_URL: ${{ secrets.PUBLIC_WEB_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${API_CERT_PINS:-}" ]]; then
            echo "::error::Secret API_CERT_PINS obrigatório (tools/release/fetch-api-cert-pin.ps1)."
            exit 1
          fi

          API_URL="${API_URL:-$API_URL_DEFAULT}"
          PUBLIC_WEB_URL="${PUBLIC_WEB_URL:-$PUBLIC_WEB_URL_DEFAULT}"

          EXTRA=()
          if [[ -n "${GOOGLE_WEB_CLIENT_ID:-}" ]]; then
            EXTRA+=(--dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID")
          fi
          if [[ -n "${GOOGLE_IOS_CLIENT_ID:-}" ]]; then
            EXTRA+=(--dart-define=GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID")
          fi

          flutter build ipa --release \
            --dart-define=API_URL="$API_URL" \
            --dart-define=PUBLIC_WEB_URL="$PUBLIC_WEB_URL" \
            --dart-define=API_CERT_PINS="$API_CERT_PINS" \
            --dart-define=REQUIRE_API_CERT_PINS=true \
            "${EXTRA[@]}" \
            --export-options-plist=ios/ExportOptions.ci.plist \
            -- \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_NAME"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: focux-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload dSYM (if present)
        uses: actions/upload-artifact@v4
        with:
          name: focux-ios-dsym
          path: build/ios/archive/Runner.xcarchive/dSYMs
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload to TestFlight (optional)
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.upload_testflight)
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ASC_KEY_ID:-}" || -z "${ASC_ISSUER_ID:-}" || -z "${ASC_KEY_BASE64:-}" ]]; then
            echo "::warning::Secrets ASC ausentes — IPA ficou só no artifact (Actions → Artifacts)."
            exit 0
          fi

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo -n "$ASC_KEY_BASE64" | base64 --decode -o "$KEY_PATH"
          IPA=$(ls build/ios/ipa/*.ipa | head -n1)
          echo "Uploading $IPA to App Store Connect..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
