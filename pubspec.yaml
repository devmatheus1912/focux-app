name: focux_app
description: "Focux — plataforma para personal trainers."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.2.1+116

environment:
  sdk: ^3.7.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9
  dio: ^5.11.1
  crypto: ^3.0.6
  flutter_secure_storage: ^10.3.4
  flutter_riverpod: ^2.6.1
  go_router: ^18.0.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.0
  stomp_dart_client: ^3.0.1
  flutter_markdown: ^0.7.4
  video_player: ^2.14.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  pdf: ^3.12.0
  printing: ^5.13.2
  fl_chart: ^1.2.0
  google_fonts: ^6.2.1
  google_sign_in: ^6.2.2
  shimmer: ^3.0.0
  provider: ^6.1.5+1
  connectivity_plus: ^7.3.1
  flutter_animate: ^4.5.2
  speech_to_text: ^7.5.0
  firebase_crashlytics: ^5.4.0
  in_app_purchase: ^3.3.1
  image_picker: ^1.2.3
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  record: ^7.1.1
  http: ^1.2.2
  camera: ^0.12.1
  google_mlkit_pose_detection: ^0.16.1
  google_mlkit_text_recognition: ^0.17.1
  rive: ^0.13.20
  local_auth: ^3.0.2
  flutter_jailbreak_detection: ^1.10.0
  health: ^13.3.2
  home_widget: ^0.10.0
  file_picker: ^13.1.0
  csv: ^8.0.0
  excel: ^4.0.6
  sign_in_with_apple: ^8.2.0
  qr_flutter: ^4.1.0
  wakelock_plus: ^1.7.0
  webview_flutter: ^4.10.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3

flutter_launcher_icons:
  android: true
  ios: true
  # Braço em fundo branco (launcher). Adaptive usa FG transparente + bg #FFF.
  image_path: "assets/images/logo_icon_launcher.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_icon_fg.png"
  adaptive_icon_foreground_inset: 16
  background_color_ios: "#FFFFFF"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0B0E14"
  # Lockup padded (~36%) — master 1254² sem padding estourava a tela.
  image: assets/images/logo_splash.png
  android_gravity: center
  ios_content_mode: center
  android_12:
    color: "#0B0E14"
    # Android 12+ usa ícone circular — só o braço.
    image: assets/images/logo_splash_icon.png
    icon_background_color: "#0B0E14"
  android: true
  ios: true
  fullscreen: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # flutter_native_splash (dev) falha na integração SPM experimental do Flutter 3.44+.
  config:
    enable-swift-package-manager: false

  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/logo_oficial_fundo_claro.png
    - assets/images/logo_oficial_fundo_escuro.png
    - assets/images/logo_icon_arm.png
    - assets/images/logo_splash.png
    - assets/images/logo_splash_icon.png
    - assets/animations/confetti_success.riv
    - assets/animations/confetti_burst.riv
    - assets/animations/cdn_heart.riv
    - assets/animations/star_sparkle.riv
    - assets/google_fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/google_fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/google_fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/JetBrainsMono-Bold.ttf
          weight: 700
    - family: Barlow Condensed
      fonts:
        - asset: assets/google_fonts/BarlowCondensed-Bold.ttf
          weight: 700
